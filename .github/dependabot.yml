version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # These two set the minimum Roslyn version consumers must provide.
    # Microsoft.CodeAnalysis.CSharp is what SliceFx.SourceGenerator compiles against,
    # so it bounds their compiler. Workspaces is what the code fix project compiles
    # against; it ships inside the generator package and the assembly comes from the
    # IDE host, so it bounds their IDE. Keep both low; ignore minor/patch. Raise the
    # floor manually only when intentionally dropping support for older SDKs --
    # majors still surface, so the decision reaches a human once per Roslyn major.
    #
    # Microsoft.CodeAnalysis.Analyzers is deliberately NOT here: it is analyzer-author
    # RS**** rules, build-time only, and sets no consumer floor.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Pinned tsc used by TS client type-check tests
  - package-ecosystem: npm
    directory: /eng/typescript-typecheck
    schedule:
      interval: weekly

  # WASI sample: jco / preview2-shim / wrangler (upstream unstable toolchain — review bumps carefully).
  # `npm audit` here reports a standing critical (decompress Zip Slip) that no bump clears:
  # jco -> componentize-js -> weval -> decompress, and weval still depends on decompress at its
  # latest version, so audit's only "fix" is downgrading jco by nine minors. It is build-time
  # tooling for componentizing JS, a path this repo never takes — we transpile a .NET-produced
  # wasm. Leave it until weval drops decompress upstream; do not downgrade jco to silence it.
  - package-ecosystem: npm
    directory: /samples/SliceFx.WasiSample/dist
    schedule:
      interval: weekly
