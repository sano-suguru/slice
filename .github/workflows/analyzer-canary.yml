name: Analyzer Canary

on:
  workflow_dispatch:
  schedule:
    # Monthly check for analyzer drift outside the required PR/main CI path.
    - cron: '17 4 1 * *'

permissions:
  contents: read
  issues: write

jobs:
  latest-analyzers:
    name: Latest .NET 10 analyzers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup latest .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore SliceFx.slnx

      - name: Build with latest recommended analyzers
        id: canary
        shell: bash
        run: |
          set +e
          dotnet build SliceFx.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:AnalysisLevel=latest-recommended --nologo 2>&1 | tee analyzer-canary.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Format check with latest .NET 10 SDK
        id: format-canary
        shell: bash
        run: |
          set +e
          dotnet format SliceFx.slnx --verify-no-changes --severity info --exclude-diagnostics CS1591 xUnit1004 2>&1 | tee format-canary.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize canary result
        shell: bash
        run: |
          if [ "${{ steps.canary.outputs.status }}" = "0" ]; then
            {
              echo "## Analyzer canary passed"
              echo
              echo "The repository builds with the latest .NET 10 SDK and \`AnalysisLevel=latest-recommended\`."
              echo "No analyzer-baseline PR was created automatically; review baseline bumps in dedicated maintenance PRs."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Analyzer canary reported diagnostics"
              echo
              echo "The required PR/main CI remains pinned to the repository baseline. Review this output before deciding whether to bump \`AnalysisLevel\`."
              echo
              echo '```text'
              tail -n 200 analyzer-canary.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.format-canary.outputs.status }}" = "0" ]; then
            {
              echo "## Format canary passed"
              echo
              echo "\`dotnet format --verify-no-changes\` is clean with the latest .NET 10 SDK, the same command the pre-push hook and required CI run against the \`global.json\`-pinned SDK."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Format canary reported diagnostics"
              echo
              echo "The pinned SDK in \`global.json\` may still be clean; this only means a newer .NET 10 SDK patch/feature band disagrees. Contributors whose local SDK has rolled forward past the pin may see the same false-positive pre-push hook failures."
              echo
              echo '```text'
              tail -n 200 format-canary.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report analyzer drift
        if: steps.canary.outputs.status != '0' || steps.format-canary.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Analyzer canary reported diagnostics"
          issue_number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          {
            if [ "${{ steps.canary.outputs.status }}" != "0" ]; then
              echo "The analyzer canary reported diagnostics with the latest .NET 10 SDK and \`AnalysisLevel=latest-recommended\`."
              echo
              echo "Required PR/main CI remains on the pinned analyzer baseline. Review this as a maintenance signal; do not bump the baseline automatically."
              echo
              echo "<details><summary>Build canary: last 200 lines</summary>"
              echo
              echo '```text'
              tail -n 200 analyzer-canary.log
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            if [ "${{ steps.format-canary.outputs.status }}" != "0" ]; then
              echo "The format canary (\`dotnet format --verify-no-changes\`) reported diagnostics with the latest .NET 10 SDK, even though the pinned SDK is expected to be clean."
              echo
              echo "This means a developer whose local SDK has rolled forward past the \`global.json\` pin may hit false-positive pre-push hook failures unrelated to their change."
              echo
              echo "<details><summary>Format canary: last 200 lines</summary>"
              echo
              echo '```text'
              tail -n 200 format-canary.log
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            echo "Workflow run: $RUN_URL"
          } > analyzer-canary-issue.md

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file analyzer-canary-issue.md
          else
            gh issue create --title "$title" --body-file analyzer-canary-issue.md
          fi
